# 개발용 카프카 단독 실행 파일.
# 앱·Redis·DB 를 로컬에서 직접 띄우고 있으므로 docker-compose-dev.yml 과 분리
#
#   기동: docker compose -f docker-compose.kafka.yml up -d
#   종료: docker compose -f docker-compose.kafka.yml down
#   초기화(오프셋·메시지 전부 삭제): docker compose -f docker-compose.kafka.yml down -v
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 호스트를 비워 둔다. 0.0.0.0 을 명시하면 기동 시 advertised.listeners 검증에 걸림
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 단일 브로커라 복제본을 늘릴 수 없다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Asia/Seoul
    volumes:
      # 브로커를 재시작해도 메시지·오프셋이 남아야 중단 후 복구 테스트가 가능
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  kafka_data:
