services:
  # 서비스 진입점. 모니터링 EC2 를 없애면서 이쪽으로 옮겨왔다 (2026-09-18).
  # TLS 종료 후 같은 compose 네트워크의 spring-boot-app:8080 으로 프록시한다.
  nginx:
    image: nginx:latest
    container_name: nginx-proxy   # certbot deploy 훅(reload-nginx.sh)이 이 이름으로 reload 한다
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot(호스트, webroot 방식)이 검증 파일을 놓는 곳
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - spring-boot-app
    networks:
      - internal
    restart: always

# docker compose down, docker stop 써야 restart 정책 무시됨 (ec2 reboot, app crash, oom 시에는 자동 재실행)
  spring-boot-app:
    volumes:
      - /home/ubuntu/mma-server/secrets/ufc_data.json:/my-files/ufc_data.json:ro
      - /home/ubuntu/mma-server/secrets/firebase-credentials.json:/my-files/firebase-credentials.json:ro
      - /home/ubuntu/mma-server/secrets/seed_faq.json:/my-files/seed_faq.json:ro
      - /var/log/myapp:/logs
    image: ${SPRING_ECR_IMAGE}
    container_name: spring-boot-container
    ports:
      - "8080:8080"
      - "9091:9091"
    #    depends_on 속성을 통해 mysql 컨테이너부터 실행되고 나서 스프링 서버 컨테이너가 실행되는 것을 보장
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    networks:
      - internal
    restart: always

  my-cache:
    image: redis
    networks:
      - internal
    expose:
      - 6379
    # redis 한도(256MB) 제한 (한도 80% 도달 시, Slack 알림)
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data:/data
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: my-cache:6379
    ports:
      - "9121:9121"
    networks:
      - internal
    restart: always
    depends_on:
      - my-cache

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'

networks:
  internal:
    driver: bridge